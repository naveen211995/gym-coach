<style>:root {
  --bg: #e9ecee;
  --surface: #ffffff;
  --surface-2: #f4f6f7;
  --ink: #1b2226;
  --ink-2: #4a565d;
  --ink-3: #6f7b82;
  --line: #d3d9dd;
  --line-strong: #b7c0c6;
  --focus: #1f5fbf;
  --load: #1f5fbf;
  --load-bg: #e3ecfa;
  --reps: #2e8b57;
  --reps-bg: #e1f2e8;
  --hold: #56636b;
  --hold-bg: #eceff1;
  --warn: #9a6f00;
  --warn-strong: #e0a800;
  --warn-bg: #fbf1d4;
  --pain: #c8323c;
  --pain-bg: #fae3e4;
  --base: #6a4fb3;
  --base-bg: #ece7f7;
  --primary: #1b2226;
  --primary-ink: #ffffff;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(20, 30, 36, 0.06), 0 2px 8px rgba(20, 30, 36, 0.05);
  --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: 'Barlow Condensed', 'Barlow', 'Arial Narrow', system-ui, sans-serif;
  --tabbar-h: 64px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #151a1e;
    --surface: #1e252a;
    --surface-2: #252d33;
    --ink: #e8ecef;
    --ink-2: #b9c3c9;
    --ink-3: #8c979e;
    --line: #333d44;
    --line-strong: #46525a;
    --focus: #7fa9ec;
    --load: #7fa9ec;
    --load-bg: #1d2c44;
    --reps: #62c28d;
    --reps-bg: #1b3326;
    --hold: #a9b4ba;
    --hold-bg: #2a3238;
    --warn: #f0c23b;
    --warn-strong: #e0a800;
    --warn-bg: #3a3018;
    --pain: #f0707a;
    --pain-bg: #43222a;
    --base: #b4a0ec;
    --base-bg: #2e2744;
    --primary: #e8ecef;
    --primary-ink: #151a1e;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #151a1e;
  --surface: #1e252a;
  --surface-2: #252d33;
  --ink: #e8ecef;
  --ink-2: #b9c3c9;
  --ink-3: #8c979e;
  --line: #333d44;
  --line-strong: #46525a;
  --focus: #7fa9ec;
  --load: #7fa9ec;
  --load-bg: #1d2c44;
  --reps: #62c28d;
  --reps-bg: #1b3326;
  --hold: #a9b4ba;
  --hold-bg: #2a3238;
  --warn: #f0c23b;
  --warn-strong: #e0a800;
  --warn-bg: #3a3018;
  --pain: #f0707a;
  --pain-bg: #43222a;
  --base: #b4a0ec;
  --base-bg: #2e2744;
  --primary: #e8ecef;
  --primary-ink: #151a1e;
  --shadow: none;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
img, svg { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.boot { display: grid; place-items: center; min-height: 80vh; color: var(--ink-2); padding: 24px; text-align: center; }

/* ───── layout ───── */
.app { max-width: 560px; margin: 0 auto; padding: 0 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 0 10px; background: var(--bg);
}
.topbar h1 { font-family: var(--font-num); font-weight: 700; font-size: 26px; letter-spacing: 0.2px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { display: block; font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.back-btn { border: 0; background: var(--surface); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink-3); min-height: 48px; position: relative; }
.tab[aria-current='page'] { color: var(--ink); }
.tab[aria-current='page']::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
.tab .dot { position: absolute; top: 10px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--reps); }

.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h2.section { font-size: 15px; font-weight: 700; margin: 14px 2px 2px; color: var(--ink-2); }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px; }
.card.flat { box-shadow: none; }
.card h3 { margin: 0 0 6px; font-size: 17px; }
.card-link { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; min-height: 56px; border: 0; border-bottom: 1px solid var(--line); background: none; }
.list-item:last-child { border-bottom: 0; }
.list-item .title { font-weight: 600; }
.list-item .meta { font-size: 13px; color: var(--ink-3); }

/* ───── buttons ───── */
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); min-height: 48px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.big { min-height: 56px; font-size: 18px; width: 100%; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--pain); border-color: var(--pain); background: transparent; }
.btn.danger.solid { background: var(--pain); color: #fff; }
.btn.small { min-height: 40px; font-size: 14px; padding: 0 12px; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-row.three { grid-template-columns: 2fr 1fr 1fr; }
.icon-btn { border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); }
.linkish { border: 0; background: none; padding: 6px 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 36px; }

/* ───── chips & segmented ───── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 22px; font-weight: 700; font-size: 16px; font-family: var(--font-num); }
.chip[aria-checked='true'], .chip[aria-pressed='true'] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.chip.text { font-family: var(--font); font-weight: 600; font-size: 14px; }
.chips.fill { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chip-pain[aria-checked='true'] { background: var(--pain); border-color: var(--pain); color: #fff; }
.chip-mild[aria-checked='true'] { background: var(--warn-strong); border-color: var(--warn-strong); color: #1b2226; }

/* ───── tags ───── */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--hold-bg); color: var(--hold); white-space: nowrap; }
.tone-load { --tone: var(--load); --tone-bg: var(--load-bg); }
.tone-reps { --tone: var(--reps); --tone-bg: var(--reps-bg); }
.tone-hold { --tone: var(--hold); --tone-bg: var(--hold-bg); }
.tone-warn { --tone: var(--warn); --tone-bg: var(--warn-bg); }
.tone-pain { --tone: var(--pain); --tone-bg: var(--pain-bg); }
.tone-base { --tone: var(--base); --tone-bg: var(--base-bg); }
.tag[class*='tone-'] { background: var(--tone-bg); color: var(--tone); }
.tag.pr { background: var(--warn-bg); color: var(--warn); }

/* ───── the target plate (signature element) ───── */
.plate { position: relative; border-radius: var(--radius); background: var(--tone-bg); padding: 12px 14px 12px 20px; overflow: hidden; }
.plate::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--tone); }
.plate-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.plate-action { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--tone); font-size: 14px; }
.plate-load { font-family: var(--font-num); font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: 0.3px; margin-top: 4px; }
.plate-load .unit { font-size: 22px; font-weight: 600; margin-left: 4px; color: var(--ink-2); }
.plate-reps { font-family: var(--font-num); font-size: 22px; font-weight: 600; color: var(--ink); }
.plate-reps .rir { color: var(--ink-2); font-weight: 500; margin-left: 8px; }
.plate-summary { margin-top: 6px; font-weight: 600; }
.reasons { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.reasons li { margin: 3px 0; }
.plate.compact { padding: 8px 10px 8px 16px; }
.plate.compact .plate-load { font-size: 26px; }
.plate.compact .plate-reps { font-size: 17px; }
.rule-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--ink-3); }

/* ───── workout ───── */
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ex-card.done { border-color: color-mix(in srgb, var(--reps) 45%, var(--line)); }
.ex-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; min-height: 64px; }
.ex-head .name { font-weight: 700; font-size: 17px; }
.ex-head .meta { font-size: 13px; color: var(--ink-3); }
.ex-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.status-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--line-strong); color: var(--ink-3); font-size: 12px; font-weight: 700; font-family: var(--font-num); }
.status-dot.done { background: var(--reps); border-color: var(--reps); color: #fff; }
.status-dot.active { border-color: var(--ink); color: var(--ink); }
.status-dot.skipped { border-style: dashed; }
.last-time { font-size: 14px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; }
.rest-timer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; }
.rest-timer strong { font-family: var(--font-num); font-size: 18px; }
.rest-timer .grow { min-width: 160px; }
.vol-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vol-row:last-child { border-bottom: 0; }
.vol-row .bar-track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.vol-row .bar-fill { height: 100%; border-radius: 3px; background: var(--reps); }
.vol-row.low .bar-fill { background: var(--warn); }
.vol-row.high .bar-fill { background: var(--load); }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; min-height: 48px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; width: 100%; }
.set-row[aria-current='true'] { border: 2px solid var(--ink); padding: 3px 9px; }
.set-row .n { font-weight: 700; color: var(--ink-3); font-size: 14px; }
.set-row .v { font-family: var(--font-num); font-size: 19px; font-weight: 600; }
.set-row .t { font-size: 13px; color: var(--ink-3); }
.set-row.logged .v { color: var(--ink); }
.set-row.failed .v { color: var(--pain); }
.editor { background: var(--surface-2); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.editor-title { font-weight: 700; }
.stepper { display: flex; flex-direction: column; gap: 4px; }
.stepper-label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; }
.stepper-row { display: grid; grid-template-columns: 56px 1fr 56px; gap: 6px; align-items: stretch; }
.stepper-row button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; font-size: 28px; font-weight: 600; min-height: 56px; line-height: 1; }
.stepper-row input { width: 100%; min-width: 0; text-align: center; font-family: var(--font-num); font-size: 32px; font-weight: 700; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: 0 4px; min-height: 56px; }
.stepper-row input::placeholder { color: var(--ink-3); font-size: 22px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two-col .stepper-row { grid-template-columns: 44px 1fr 44px; gap: 4px; }
.two-col .stepper-row input { font-size: 24px; }
.two-col .stepper-row button { font-size: 24px; }
.result { border-radius: var(--radius); border: 2px solid var(--tone); background: var(--surface); padding: 12px; }
.result-head { display: flex; align-items: center; gap: 10px; }
.result-arrow { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--tone); color: #fff; flex: none; }
.result-line { font-family: var(--font-num); font-size: 24px; font-weight: 700; line-height: 1.1; }
.banner { border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn-strong) 50%, transparent); }
.banner.pain { background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 40%, transparent); }
.banner.info { background: var(--load-bg); border: 1px solid color-mix(in srgb, var(--load) 30%, transparent); }

/* ───── dashboard ───── */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; }
.stat .v { font-family: var(--font-num); font-size: 26px; font-weight: 700; line-height: 1; }
.stat .l { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.next-list { display: flex; flex-direction: column; }
.next-item { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.next-item:last-child { border-bottom: 0; }
.next-item .bar { align-self: stretch; border-radius: 3px; background: var(--tone); }
.next-item .t { font-family: var(--font-num); font-size: 17px; font-weight: 600; text-align: right; }

/* ───── forms ───── */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field .label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field input[type='text'], .field input[type='number'], .field input:not([type]), .field select, .field textarea, .input {
  min-height: 48px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: 10px 12px; font-size: 16px; width: 100%;
}
.field textarea, textarea.input { min-height: 96px; resize: vertical; }
.field .err { color: var(--pain); font-size: 13px; font-weight: 600; }
.field .hint { color: var(--ink-3); font-size: 13px; }
.field.invalid input, .field.invalid select { border-color: var(--pain); }
.field .label-row { display: flex; align-items: center; gap: 6px; }
.help-btn { appearance: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.strategy-help-list { display: flex; flex-direction: column; gap: 14px; margin: 10px 0 4px; }
.strategy-help-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.strategy-help-item.current { border-color: var(--reps); background: color-mix(in srgb, var(--reps) 8%, var(--surface)); }
.strategy-help-item h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.strategy-help-item .tag { font-size: 11px; font-weight: 700; color: var(--reps); border: 1px solid var(--reps); border-radius: 999px; padding: 1px 8px; }
.strategy-help-item p { margin: 0; font-size: 14px; color: var(--ink-2); }
.strategy-help-item .best-for { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--line-strong); position: relative; flex: none; border: 0; transition: background 0.15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch:checked { background: var(--reps); }
.switch:checked::after { transform: translateX(20px); }

/* ───── sheet / toast ───── */
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 16, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2); }
.sheet h2 { margin: 0; font-size: 20px; font-family: var(--font-num); }
/* A sheet with a pinned footer scrolls its body, not the whole sheet, so the
   primary action stays on screen however long the list is. */
.sheet.has-footer { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.sheet.has-footer .sheet-body { overflow: auto; -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0; }
.sheet.has-footer .sheet-footer { flex: 0 0 auto; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
.toast { pointer-events: auto; max-width: 520px; width: 100%; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; border: 0; text-align: left; }
.toast.error { background: var(--pain); color: #fff; }
.toast.success { background: var(--reps); color: #fff; }

/* ───── charts ───── */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--load); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--surface); stroke: var(--load); stroke-width: 2; }
.chart .pt.pr { fill: var(--warn-strong); stroke: var(--warn-strong); }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.table-wrap { overflow-x: auto; }
table.simple { border-collapse: collapse; width: 100%; font-size: 14px; }
table.simple th, table.simple td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.simple th { color: var(--ink-3); font-weight: 700; font-size: 12px; }
table.simple td.num { font-family: var(--font-num); font-size: 16px; }

.empty { text-align: center; padding: 28px 16px; color: var(--ink-2); }
.empty h3 { margin: 6px 0; color: var(--ink); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { position: relative; padding: 10px 0 10px 18px; border-left: 2px solid var(--line); margin-left: 6px; }
.tl-item::before { content: ''; position: absolute; left: -7px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); }
.tl-next { margin-top: 6px; font-size: 14px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
@media (min-width: 420px) {
  .plate-load { font-size: 44px; }
}
</style>
